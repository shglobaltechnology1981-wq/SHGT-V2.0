<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SHGT Admin Dashboard</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="../css/responsive.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<!-- ==========================
     ADMIN NAVBAR
=========================== -->


<header class="navbar">


<div class="container nav-container">


<a href="../index.html"
class="logo">

<img src="../images/logo.png"
alt="SHGT Logo">

</a>



<div>


<button id="logoutBtn"
class="btn btn-primary">

<i class="fas fa-sign-out-alt"></i>

Logout

</button>


</div>



</div>


</header>





<!-- ==========================
     DASHBOARD
=========================== -->


<section class="admin-dashboard">


<div class="container">



<h1>

SHGT Admin Dashboard

</h1>


<p>

Manage Industrial Sewing Machine Products

</p>





<!-- ==========================
     STAT CARD
=========================== -->


<div class="dashboard-grid">



<div class="dashboard-card">


<i class="fas fa-box"></i>


<h2 id="productCount">

0

</h2>


<p>

Total Products

</p>


</div>





<div class="dashboard-card">


<i class="fas fa-upload"></i>


<h2>

Upload

</h2>


<p>

Add New Product

</p>


</div>





<div class="dashboard-card">


<i class="fas fa-cogs"></i>


<h2>

Manage

</h2>


<p>

Product Control

</p>


</div>



</div>





<!-- ==========================
     ACTION BUTTONS
=========================== -->


<div class="admin-actions">


<a href="upload.html"
class="btn btn-primary">


<i class="fas fa-plus"></i>

Add Product


</a>



<a href="../index.html"
class="btn btn-outline">


<i class="fas fa-globe"></i>

View Website


</a>



</div>







<!-- ==========================
     PRODUCT TABLE
=========================== -->


<div class="admin-table-box">


<h2>

Product List

</h2>



<table>


<thead>

<tr>

<th>
Image
</th>


<th>
Model
</th>


<th>
Brand
</th>


<th>
Price
</th>


<th>
Action
</th>


</tr>


</thead>



<tbody id="adminProductList">


<tr>

<td colspan="5">

Loading Products...

</td>


</tr>


</tbody>



</table>



</div>





</div>


</section>






<!-- ==========================
     SCRIPT
=========================== -->


<script type="module"
src="admin.js"></script>


<script type="module"
src="dashboard.js"></script>



</body>

</html>
